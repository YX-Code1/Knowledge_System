server:
  port: 8080

spring:
  application:
    name: knowledge-system
  # 本地开发默认激活 local profile：本机真实配置写在 application-local.yml（已被 gitignore，不入库）
  # 其他人 clone 后只需复制 application-local.yml.example 改名为 application-local.yml 即可
  profiles:
    active: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/knowledge_base?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      # 连接/命令超时都设短：Redis 不可达时快速失败，
      # 认证链路里的缓存与限流都有降级兜底，不需要长时间等待
      connect-timeout: 1000ms
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.knowledge.base.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  # 生产环境必须通过环境变量覆盖，默认值仅用于本地开发
  secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-in-production-0000}
  expiration: 86400000
  header: Authorization
  prefix: Bearer

# AI 相关配置：DeepSeek 负责对话生成（OpenAI 兼容协议），硅基流动负责 embedding
# （DeepSeek 官方无 embedding 接口）。真实 key 放在 application-local.yml（已 gitignore）
ai:
  deepseek:
    api-key: ${AI_DEEPSEEK_API_KEY:}
    base-url: ${AI_DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
    model: ${AI_DEEPSEEK_MODEL:deepseek-v4-flash}
    timeout-seconds: 60
  siliconflow:
    api-key: ${AI_SILICONFLOW_API_KEY:}
    base-url: ${AI_SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
    embedding-model: ${AI_SILICONFLOW_EMBEDDING_MODEL:BAAI/bge-m3}
  chat:
    # 每用户每分钟提问次数上限（控制 API 费用，Redis Lua 原子计数）
    rate-limit-per-minute: 20
  quota:
    # 每用户每日 AI 调用次数上限（摘要/标签/问答各消耗 1 次，Redis Lua 原子扣减；Redis 不可用时降级放行）
    daily-limit: 30

logging:
  level:
    com.knowledge.base: debug
